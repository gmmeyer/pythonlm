[project]
name = "bcvm"
version = "0.1.0"
description = "Learned bytecode interpreter: data pipeline, reference interpreter and runner harness"
requires-python = "==3.14.*"
dependencies = ["numpy>=2.3"]

[project.optional-dependencies]
train = ["torch>=2.9"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bcvm = "bcvm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
